name: Feature request
description: Propose a new capability or a change to existing behavior.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What task is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: |
        Describe the behavior you would like. If it touches agent execution,
        repository state (`CodeVia/`), or access control, say how it should
        interact with the repository-first contract and per-account isolation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: Scope acknowledgement
      options:
        - label: This keeps the offline mode (Mock AI/GitHub/Telegram) working without API keys.
          required: true
        - label: This does not store secrets or credentials in the repository.
          required: true
